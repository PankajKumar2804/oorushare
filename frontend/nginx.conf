server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to backend container if called through same port
    location /spots { proxy_pass http://backend:3001; }
    location /bookings { proxy_pass http://backend:3001; }
    location /queue { proxy_pass http://backend:3001; }
    location /credits { proxy_pass http://backend:3001; }
    location /rwa { proxy_pass http://backend:3001; }
    location /integrations { proxy_pass http://backend:3001; }
    location /agent { proxy_pass http://backend:3001; }
    location /health { proxy_pass http://backend:3001; }
    location /live {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}

