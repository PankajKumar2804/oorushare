<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
const SPEC = {
  openapi: "3.0.3",
  info: {
    title: "OoruShare API",
    version: "1.0.0",
    description: `**OoruShare** — Decentralised residential driveway sharing as authorised 2-minute delivery loading bays for Bengaluru's last-10-metres quick-commerce problem.\n\n**Base URL:** \`http://localhost:3001\`\n\n**Built by:** Pankajkr Jain (Pankaj Kumar) · IBM Bobathon 2026\n\n**GitHub:** https://github.com/PankajKumar2804/oorushare`,
    contact: { name: "Pankajkr Jain", url: "https://github.com/PankajKumar2804/oorushare" },
    license: { name: "MIT", url: "https://github.com/PankajKumar2804/oorushare/blob/main/LICENSE" }
  },
  servers: [
    { url: "http://localhost:3001", description: "Local development server" }
  ],
  tags: [
    { name: "Spots",        description: "Residential driveway spot CRUD — list, get, create, status toggle" },
    { name: "Bookings",     description: "Rider 2-minute loading slot bookings — atomic via PostgreSQL advisory lock" },
    { name: "Credits",      description: "Community credit ledger — earn, summary, redeem for RWA maintenance offsets" },
    { name: "Queue",        description: "Dark store dispatch queue — IBM Granite 3.8B congestion-staggered dispatch" },
    { name: "RWA",          description: "RWA governance — approve or reject resident driveway listings" },
    { name: "Integrations", description: "B2B BAA dispatch webhook — Blinkit / Zepto / Swiggy platform integration" },
    { name: "Agent",        description: "Autonomous agentic curb governor — activity feed, impact metrics, tour simulation" },
    { name: "System",       description: "Health probe and Server-Sent Events live data stream" }
  ],
  paths: {

    /* ── /spots ──────────────────────────────────────────────────────── */
    "/spots": {
      get: {
        tags: ["Spots"],
        summary: "List all approved driveway spots",
        description: "Returns all RWA-approved spots. Filter by neighbourhood, status, or owner. Add `include_all=true` to include pending/rejected spots (admin use).",
        parameters: [
          { name: "neighborhood", in: "query", schema: { type: "string", example: "HSR Layout" }, description: "Filter to a specific area" },
          { name: "status",       in: "query", schema: { type: "string", enum: ["available","booked","unavailable"] }, description: "Filter by spot status" },
          { name: "owner_name",   in: "query", schema: { type: "string", example: "Priya Sharma" }, description: "Filter to one resident's listings" },
          { name: "include_all",  in: "query", schema: { type: "string", enum: ["true","false"] }, description: "Include non-approved spots" }
        ],
        responses: {
          "200": { description: "Array of spot objects", content: { "application/json": { schema: { type: "array", items: { "$ref": "#/components/schemas/Spot" } } } } }
        }
      },
      post: {
        tags: ["Spots"],
        summary: "Resident lists a new driveway spot",
        description: "Creates a new driveway listing. Spot starts with `rwa_status=pending` — must be approved by RWA before appearing on the rider map.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: { "$ref": "#/components/schemas/SpotCreate" } } }
        },
        responses: {
          "201": { description: "Created spot object", content: { "application/json": { schema: { "$ref": "#/components/schemas/Spot" } } } },
          "400": { description: "Missing required fields", content: { "application/json": { schema: { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/spots/{id}": {
      get: {
        tags: ["Spots"],
        summary: "Get a single spot by ID",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer", example: 1 } }],
        responses: {
          "200": { description: "Spot object", content: { "application/json": { schema: { "$ref": "#/components/schemas/Spot" } } } },
          "404": { description: "Spot not found", content: { "application/json": { schema: { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/spots/{id}/status": {
      patch: {
        tags: ["Spots"],
        summary: "Toggle spot availability",
        description: "Resident marks their spot unavailable (car is home) or available. Also used internally by bookings auto-release.",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        requestBody: {
          required: true,
          content: { "application/json": { schema: { type: "object", required: ["status"], properties: { status: { type: "string", enum: ["available","booked","unavailable"] } } } } }
        },
        responses: {
          "200": { description: "Updated spot", content: { "application/json": { schema: { "$ref": "#/components/schemas/Spot" } } } },
          "400": { description: "Invalid status value" },
          "404": { description: "Spot not found" }
        }
      }
    },

    /* ── /bookings ────────────────────────────────────────────────────── */
    "/bookings": {
      get: {
        tags: ["Bookings"],
        summary: "List bookings",
        parameters: [{ name: "spot_id", in: "query", schema: { type: "integer" }, description: "Filter by spot" }],
        responses: {
          "200": { description: "Array of bookings (newest first)", content: { "application/json": { schema: { type: "array", items: { "$ref": "#/components/schemas/Booking" } } } } }
        }
      },
      post: {
        tags: ["Bookings"],
        summary: "Rider books a 2-minute loading slot",
        description: "**Atomic via PostgreSQL advisory lock** (`pg_try_advisory_xact_lock`). Prevents double-booking under concurrent load. Auto-releases spot after `duration_mins`. Awards 10 community credits to spot owner. Publishes SSE update.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: { "$ref": "#/components/schemas/BookingCreate" } } }
        },
        responses: {
          "201": { description: "Created booking", content: { "application/json": { schema: { "$ref": "#/components/schemas/Booking" } } } },
          "400": { description: "Missing spot_id or rider_name" },
          "409": { description: "Spot already booked or advisory lock contention", content: { "application/json": { schema: { "$ref": "#/components/schemas/Error" } } } }
        }
      }
    },
    "/bookings/{id}": {
      delete: {
        tags: ["Bookings"],
        summary: "Cancel a booking early",
        description: "Marks booking as cancelled. Immediately restores spot to `available`.",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        responses: {
          "200": { description: "Cancelled booking", content: { "application/json": { schema: { "$ref": "#/components/schemas/Booking" } } } },
          "404": { description: "Booking not found" }
        }
      }
    },
    "/bookings/{id}/report-blocked": {
      post: {
        tags: ["Bookings"],
        summary: "Report spot blocked — auto-reroute",
        description: "Marks booking cancelled, flags spot `unavailable`, finds nearest alternative available spot, and auto-creates a new booking. Returns `reallocated: true` with new booking details if an alternative exists.",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        responses: {
          "200": {
            description: "Conflict resolved — new booking or no-alternative message",
            content: { "application/json": { schema: { "$ref": "#/components/schemas/BlockedResolution" } } }
          },
          "404": { description: "Booking not found" }
        }
      }
    },

    /* ── /credits ─────────────────────────────────────────────────────── */
    "/credits": {
      get: {
        tags: ["Credits"],
        summary: "List credit transactions",
        parameters: [{ name: "owner_name", in: "query", schema: { type: "string" }, description: "Filter to one resident" }],
        responses: {
          "200": { description: "Array of credit records", content: { "application/json": { schema: { type: "array", items: { "$ref": "#/components/schemas/Credit" } } } } }
        }
      }
    },
    "/credits/summary": {
      get: {
        tags: ["Credits"],
        summary: "Credit balance summary for a resident",
        parameters: [{ name: "owner_name", in: "query", required: true, schema: { type: "string", example: "Priya Sharma" } }],
        responses: {
          "200": { description: "Balance summary", content: { "application/json": { schema: { "$ref": "#/components/schemas/CreditSummary" } } } }
        }
      }
    },
    "/credits/redeem": {
      post: {
        tags: ["Credits"],
        summary: "Redeem 10 credits for ₹50 RWA maintenance offset",
        description: "Requires at least 10 credits. Deducts credits and creates a redemption record. The RWA dashboard shows pending redemptions for settlement.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: { type: "object", required: ["owner_name"], properties: { owner_name: { type: "string", example: "Priya Sharma" } } } } }
        },
        responses: {
          "200": { description: "Redemption confirmed with new balance" },
          "400": { description: "Insufficient credits (need ≥ 10)" }
        }
      }
    },
    "/credits/redemptions": {
      get: {
        tags: ["Credits"],
        summary: "List all credit redemptions",
        responses: {
          "200": { description: "Array of redemption records" }
        }
      }
    },

    /* ── /queue ───────────────────────────────────────────────────────── */
    "/queue": {
      get: {
        tags: ["Queue"],
        summary: "List dispatch queue entries",
        parameters: [
          { name: "dark_store", in: "query", schema: { type: "string", example: "Blinkit HSR" } },
          { name: "status",     in: "query", schema: { type: "string", enum: ["pending","dispatched","completed"] } }
        ],
        responses: {
          "200": { description: "Array of queue entries", content: { "application/json": { schema: { type: "array", items: { "$ref": "#/components/schemas/QueueEntry" } } } } }
        }
      },
      post: {
        tags: ["Queue"],
        summary: "Add a rider to the dispatch queue",
        description: "Dark store adds a rider. The IBM Granite 3.8B forecast calculates the staggered `scheduled_at` time to prevent bylane clustering.",
        requestBody: {
          required: true,
          content: { "application/json": { schema: { "$ref": "#/components/schemas/QueueCreate" } } }
        },
        responses: {
          "201": { description: "Created queue entry with staggered dispatch time" }
        }
      }
    },
    "/queue/forecast": {
      get: {
        tags: ["Queue"],
        summary: "Congestion forecast by neighbourhood",
        description: "Returns current saturation % and recommended dispatch interval for each zone, based on IBM Granite 3.8B time-series analysis.",
        responses: {
          "200": { description: "Forecast per zone", content: { "application/json": { schema: { "$ref": "#/components/schemas/Forecast" } } } }
        }
      }
    },
    "/queue/stats": {
      get: {
        tags: ["Queue"],
        summary: "Dispatch queue aggregate stats",
        responses: {
          "200": { description: "Pending count, active zones, avg interval" }
        }
      }
    },
    "/queue/{id}/dispatch": {
      patch: {
        tags: ["Queue"],
        summary: "Mark rider as dispatched",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        responses: {
          "200": { description: "Updated queue entry" },
          "404": { description: "Entry not found" }
        }
      }
    },

    /* ── /rwa ─────────────────────────────────────────────────────────── */
    "/rwa/spots": {
      get: {
        tags: ["RWA"],
        summary: "List spots for RWA review",
        parameters: [{ name: "rwa_status", in: "query", schema: { type: "string", enum: ["pending","approved","rejected"] } }],
        responses: {
          "200": { description: "Array of spots for governance review" }
        }
      }
    },
    "/rwa/stats": {
      get: {
        tags: ["RWA"],
        summary: "RWA governance stats",
        description: "Returns count of approved, pending, rejected spots and total credits disbursed.",
        responses: {
          "200": { description: "Governance stats", content: { "application/json": { schema: { "$ref": "#/components/schemas/RwaStats" } } } }
        }
      }
    },
    "/rwa/spots/{id}/approve": {
      patch: {
        tags: ["RWA"],
        summary: "Approve a driveway listing",
        description: "Sets `rwa_status=approved`. Spot immediately appears on the rider map.",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        responses: {
          "200": { description: "Approved spot" },
          "404": { description: "Spot not found" }
        }
      }
    },
    "/rwa/spots/{id}/reject": {
      patch: {
        tags: ["RWA"],
        summary: "Reject a driveway listing",
        description: "Sets `rwa_status=rejected`. Spot is hidden from riders.",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "integer" } }],
        responses: {
          "200": { description: "Rejected spot" },
          "404": { description: "Spot not found" }
        }
      }
    },

    /* ── /integrations ────────────────────────────────────────────────── */
    "/integrations/dispatch": {
      post: {
        tags: ["Integrations"],
        summary: "BAA dispatch webhook — platform pushes a rider",
        description: "**Primary B2B revenue endpoint.** Quick-commerce platforms (Blinkit, Zepto, Swiggy) call this via their Business Associate Agreement. OoruShare finds the nearest available approved bay, reserves it, awards credits to the resident, and returns the bay address to the platform for rider briefing — zero new app required for the rider.",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: { "$ref": "#/components/schemas/DispatchRequest" },
              example: { platform: "Blinkit", dark_store: "Blinkit HSR Layout", rider_name: "Ramesh", neighborhood: "HSR Layout" }
            }
          }
        },
        responses: {
          "200": { description: "Bay allocated — returns spot address + booking ID", content: { "application/json": { schema: { "$ref": "#/components/schemas/DispatchResponse" } } } },
          "404": { description: "No available bays in that neighbourhood" }
        }
      }
    },
    "/integrations/dispatches": {
      get: {
        tags: ["Integrations"],
        summary: "List all platform-dispatched bookings",
        parameters: [{ name: "platform", in: "query", schema: { type: "string" } }],
        responses: {
          "200": { description: "Array of dispatch records" }
        }
      }
    },

    /* ── /agent ───────────────────────────────────────────────────────── */
    "/agent/activity": {
      get: {
        tags: ["Agent"],
        summary: "Live agentic activity feed",
        description: "Returns the last 20 autonomous decisions made by the curb governor — perception inputs, Granite reasoning, actions taken, reflection outcomes.",
        responses: {
          "200": { description: "Activity log array" }
        }
      }
    },
    "/agent/impact": {
      get: {
        tags: ["Agent"],
        summary: "Live civic impact metrics",
        description: "Returns real-time ESG metrics: CO₂ abated, transit time saved, fines averted, dispute reduction %.",
        responses: {
          "200": { description: "Impact telemetry", content: { "application/json": { schema: { "$ref": "#/components/schemas/ImpactMetrics" } } } }
        }
      }
    },
    "/agent/tour": {
      post: {
        tags: ["Agent"],
        summary: "Run full 30-second agent simulation",
        description: "Triggers the 4-phase agentic loop: Perception → Reasoning (Granite 3.8B) → Action (bay allocation) → Reflection (conflict scan). Returns allocation result, resident credited, credits awarded, and decision trace.",
        responses: {
          "200": { description: "Tour simulation result", content: { "application/json": { schema: { "$ref": "#/components/schemas/TourResult" } } } }
        }
      }
    },

    /* ── System ───────────────────────────────────────────────────────── */
    "/health": {
      get: {
        tags: ["System"],
        summary: "Liveness probe",
        description: "No auth, no rate limit. Returns `{status:'ok'}` when the server is alive.",
        responses: {
          "200": { description: "Server alive", content: { "application/json": { example: { status: "ok", uptime: 3600 } } } }
        }
      }
    },
    "/live": {
      get: {
        tags: ["System"],
        summary: "Server-Sent Events — live spot + queue stream",
        description: "SSE stream (Redis fan-out). Pushes updated spot list and dispatch queue every `SSE_INTERVAL_MS` (default 3000ms). Connect with `EventSource`. Each event: `data: {spots:[], queue:[]}`.",
        responses: {
          "200": { description: "SSE stream — Content-Type: text/event-stream" }
        }
      }
    }
  },

  components: {
    schemas: {
      Spot: {
        type: "object",
        properties: {
          id:             { type: "integer", example: 1 },
          owner_name:     { type: "string",  example: "Priya Sharma" },
          address:        { type: "string",  example: "14, 27th Main, HSR Layout Sec 1" },
          neighborhood:   { type: "string",  example: "HSR Layout" },
          lat:            { type: "number",  example: 12.9116 },
          lng:            { type: "number",  example: 77.6412 },
          gate_width_m:   { type: "number",  example: 3.0 },
          available_from: { type: "string",  example: "09:00" },
          available_to:   { type: "string",  example: "18:00" },
          status:         { type: "string",  enum: ["available","booked","unavailable"], example: "available" },
          rwa_status:     { type: "string",  enum: ["pending","approved","rejected"],   example: "approved" }
        }
      },
      SpotCreate: {
        type: "object", required: ["owner_name","address","lat","lng"],
        properties: {
          owner_name:     { type: "string",  example: "Priya Sharma" },
          address:        { type: "string",  example: "14, 27th Main, HSR Layout Sec 1" },
          neighborhood:   { type: "string",  example: "HSR Layout", default: "HSR Layout" },
          lat:            { type: "number",  example: 12.9116 },
          lng:            { type: "number",  example: 77.6412 },
          gate_width_m:   { type: "number",  example: 3.0, default: 3.0 },
          available_from: { type: "string",  example: "09:00" },
          available_to:   { type: "string",  example: "18:00" }
        }
      },
      Booking: {
        type: "object",
        properties: {
          id:            { type: "integer", example: 42 },
          spot_id:       { type: "integer", example: 1 },
          rider_name:    { type: "string",  example: "Ramesh Kumar" },
          platform:      { type: "string",  enum: ["Blinkit","Zepto","Swiggy","Dunzo"], example: "Blinkit" },
          duration_mins: { type: "integer", example: 2 },
          booked_at:     { type: "string",  format: "date-time" },
          status:        { type: "string",  enum: ["active","completed","cancelled"], example: "active" }
        }
      },
      BookingCreate: {
        type: "object", required: ["spot_id","rider_name"],
        properties: {
          spot_id:       { type: "integer", example: 3 },
          rider_name:    { type: "string",  example: "Ramesh Kumar" },
          rider_phone:   { type: "string",  example: "+91 98765 43210" },
          platform:      { type: "string",  enum: ["Blinkit","Zepto","Swiggy","Dunzo"], default: "Blinkit" },
          duration_mins: { type: "integer", default: 2, example: 2 }
        }
      },
      BlockedResolution: {
        type: "object",
        properties: {
          status:            { type: "string", example: "blocked_resolved" },
          message:           { type: "string" },
          previous_spot_id:  { type: "integer" },
          reallocated:       { type: "boolean", example: true },
          new_spot:          { "$ref": "#/components/schemas/Spot" },
          new_booking:       { "$ref": "#/components/schemas/Booking" }
        }
      },
      Credit: {
        type: "object",
        properties: {
          id:         { type: "integer" },
          owner_name: { type: "string",  example: "Priya Sharma" },
          spot_id:    { type: "integer" },
          booking_id: { type: "integer" },
          credits:    { type: "number",  example: 10 },
          reason:     { type: "string",  example: "Driveway share — Blinkit" },
          created_at: { type: "string",  format: "date-time" }
        }
      },
      CreditSummary: {
        type: "object",
        properties: {
          owner_name:     { type: "string" },
          total_credits:  { type: "number", example: 40 },
          redeemed:       { type: "number", example: 10 },
          available:      { type: "number", example: 30 },
          rwa_offset_inr: { type: "number", example: 150 }
        }
      },
      QueueEntry: {
        type: "object",
        properties: {
          id:            { type: "integer" },
          dark_store:    { type: "string",  example: "Blinkit HSR Layout" },
          platform:      { type: "string",  example: "Blinkit" },
          rider_name:    { type: "string",  example: "Ravi" },
          neighborhood:  { type: "string",  example: "HSR Layout" },
          status:        { type: "string",  enum: ["pending","dispatched","completed"] },
          scheduled_at:  { type: "string",  format: "date-time" },
          stagger_mins:  { type: "number",  example: 4 }
        }
      },
      QueueCreate: {
        type: "object", required: ["dark_store","platform","rider_name"],
        properties: {
          dark_store:   { type: "string", example: "Blinkit HSR Layout" },
          platform:     { type: "string", enum: ["Blinkit","Zepto","Swiggy","Dunzo"] },
          rider_name:   { type: "string", example: "Ravi" },
          neighborhood: { type: "string", example: "HSR Layout" }
        }
      },
      Forecast: {
        type: "object",
        example: {
          "HSR Layout":   { saturation_pct: 42, recommended_interval_mins: 4, status: "busy" },
          "Indiranagar":  { saturation_pct: 28, recommended_interval_mins: 3, status: "moderate" },
          "Koramangala":  { saturation_pct: 15, recommended_interval_mins: 2, status: "clear" }
        }
      },
      RwaStats: {
        type: "object",
        properties: {
          approved:        { type: "integer", example: 18 },
          pending:         { type: "integer", example: 4 },
          rejected:        { type: "integer", example: 2 },
          total_credits:   { type: "number",  example: 410 },
          redemptions:     { type: "integer", example: 8 }
        }
      },
      DispatchRequest: {
        type: "object", required: ["platform","dark_store","rider_name","neighborhood"],
        properties: {
          platform:     { type: "string", enum: ["Blinkit","Zepto","Swiggy","Dunzo"], example: "Blinkit" },
          dark_store:   { type: "string", example: "Blinkit HSR Layout" },
          rider_name:   { type: "string", example: "Ramesh" },
          neighborhood: { type: "string", example: "HSR Layout" }
        }
      },
      DispatchResponse: {
        type: "object",
        properties: {
          status:     { type: "string", example: "dispatched" },
          bay:        { "$ref": "#/components/schemas/Spot" },
          booking_id: { type: "integer", example: 99 },
          message:    { type: "string",  example: "Rider dispatched to 14, 27th Main, HSR Layout Sec 1" }
        }
      },
      ImpactMetrics: {
        type: "object",
        properties: {
          primary_metric:  { type: "object", properties: { headline: { type: "string", example: "4.2 minutes transit delay eliminated per drop" } } },
          telemetry: {
            type: "object",
            properties: {
              co2_emissions_abated_kg:     { type: "number", example: 14.8 },
              transit_hours_saved_daily:   { type: "number", example: 140000 },
              police_fines_averted_inr:    { type: "number", example: 12500 },
              rwa_dispute_reduction_pct:   { type: "number", example: 88 }
            }
          }
        }
      },
      TourResult: {
        type: "object",
        properties: {
          phase:         { type: "string", example: "REFLECTION" },
          spot:          { "$ref": "#/components/schemas/Spot" },
          booking:       { "$ref": "#/components/schemas/Booking" },
          credits_awarded: { type: "number", example: 10 },
          reasoning:     { type: "string" },
          outcome:       { type: "string", example: "4.2 minutes transit saved | 0.14 kg CO₂ abated | Zero driveway blockage" }
        }
      },
      Error: {
        type: "object",
        properties: { error: { type: "string", example: "Spot is not available" } }
      }
    }
  }
};

SwaggerUIBundle({
  spec: SPEC,
  dom_id: '#swagger-ui',
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
  layout: "BaseLayout",
  tryItOutEnabled: true,
  requestInterceptor: (req) => {
    // Point all try-it-out calls at the local server
    if (req.url.startsWith('/')) req.url = 'http://localhost:3001' + req.url;
    return req;
  }
});
</script>
</body>
</html>
