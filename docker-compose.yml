version: '3.9'

# OoruShare production-ready compose
#
# Services:
#   db        — PostgreSQL 15 (primary data store)
#   pgbouncer — Connection pooler in front of PostgreSQL
#               Keeps DB connections low while backends scale out
#   redis     — Pub/sub for SSE fan-out + optional rate-limit store
#   backend   — Node.js API (scale with: docker compose up --scale backend=4)
#   frontend  — nginx serving static HTML/CSS/JS
#
# Scaling checklist:
#   1. docker compose up --scale backend=4   # 4 API replicas
#   2. Add a load balancer (nginx/traefik) in front of backend:3001 replicas
#   3. Set NODE_CLUSTER=1 to also fork within each container (CPU × replicas)
#   4. Point DATABASE_URL at PgBouncer:5432 (already done here)
#   5. Set POOL_MAX=5 per backend when PgBouncer is in use (transaction mode)

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       oorushare
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout:  5s
      retries:  10
    ports:
      - "5433:5432"

  # ── PgBouncer — connection pooler ─────────────────────────────────────────
  # Accepts up to 1000 client connections and multiplexes them into a small
  # pool of real PostgreSQL connections (transaction pooling mode).
  # Backend services connect to pgbouncer:5432, not postgres:5432.
  pgbouncer:
    image: bitnami/pgbouncer:latest
    environment:
      POSTGRESQL_HOST:           db
      POSTGRESQL_PORT:           5432
      POSTGRESQL_USERNAME:       postgres
      POSTGRESQL_PASSWORD:       postgres
      POSTGRESQL_DATABASE:       oorushare
      PGBOUNCER_DATABASE:        oorushare
      PGBOUNCER_POOL_MODE:       transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MIN_POOL_SIZE:   5
      PGBOUNCER_RESERVE_POOL_SIZE: 5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5432:5432"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10
    ports:
      - "6379:6379"

  # ── Backend API ───────────────────────────────────────────────────────────
  # Scale with:  docker compose up --scale backend=4
  backend:
    build: ./backend
    environment:
      DATABASE_URL:    postgresql://postgres:postgres@pgbouncer:5432/oorushare
      REDIS_URL:       redis://redis:6379
      PORT:            3001
      NODE_ENV:        production
      # Pool: keep low per-process when PgBouncer is in transaction mode
      POOL_MAX:        5
      POOL_IDLE_MS:    10000
      POOL_CONNECT_MS: 3000
      # Rate limits
      RATE_API_MAX:    300
      RATE_BOOK_MAX:   10
      RATE_WINDOW_MS:  60000
      # SSE interval
      SSE_INTERVAL_MS: 3000
      # Uncomment to enable in-process cluster (use with scale=1 only)
      # NODE_CLUSTER: "1"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Frontend (nginx) ──────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
